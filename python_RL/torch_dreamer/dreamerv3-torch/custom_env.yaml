custom_env:
  # Logging directories (REQUIRED - can't be null)
  logdir: '~/dreamer_logs/xr_bitrate'
  traindir: null  # Auto-generated from logdir
  evaldir: null   # Auto-generated from logdir
  # video_pred_log: false  #
  
  # Task identification
  task: 'xr_bitrate_abr'
  
  # Training duration
  steps: 1e7
  
  # Environment settings
  envs: 1
  action_repeat: 1
  prefill: 3000
  time_limit: 1000
  seed: 42
  offline_traindir: ''
  offline_evaldir: ''
  parallel: False
  reset_every: 0
  device: 'cuda:0'
  batch_size: 16
  batch_length: 64
  train_ratio: 512
  pretrain: 100
  model_lr: 1e-4
  opt_eps: 1e-8
  grad_clip: 1000
  dataset_size: 1000000
  opt: 'adam'
  

  # Behavior.
  discount: 0.997
  discount_lambda: 0.95
  imag_horizon: 15
  # imag_gradient: 'dynamics'
  imag_gradient_mix: 0.0
  eval_state_mean: False

  # Exploration
  expl_behavior: 'greedy'
  expl_until: 0
  expl_extr_scale: 0.0
  expl_intr_scale: 1.0
  disag_target: 'stoch'
  disag_log: True
  disag_models: 10
  disag_offset: 1
  disag_layers: 4
  disag_units: 400
  disag_action_cond: False

  
  # Use MLP encoder/decoder (no images)

  encoder: 
    mlp_keys: '^vector$'  # <-- CHANGED: Use regex for "vector" only
    cnn_keys: '$^'        # <-- CHANGED: Use regex for "nothing"
    mlp_layers: 3
    mlp_units: 256
  
  decoder:
    mlp_keys: '^vector$'  # <-- CHANGED: Use regex for "vector" only
    cnn_keys: '$^'        # <-- CHANGED: Use regex for "nothing"
    mlp_layers: 3
    mlp_units: 256

  # encoder: 
  #   mlp_keys: '.*'
  #   cnn_keys: '$^'
  #   mlp_layers: 3
  #   mlp_units: 256
  
  # decoder:
  #   mlp_keys: '.*'
  #   cnn_keys: '$^'
  #   mlp_layers: 3
  #   mlp_units: 256
  
  # Discrete actions for bitrate selection
  actor:
    dist: 'onehot'
    std: 'none'
  
  # Logging
  log_every: 500
  eval_every: 5e3
  precision: 32
  debug: False
  video_pred_log: False
  
  # Use REINFORCE for discrete actions
  imag_gradient: 'reinforce'

  # 1. Select W&B as the logger
  logger: 'wandb'
  
  # 2. Configure W&B settings
  # This 'wandb' block MUST be at the top level
  # (same indentation as 'logger', 'task', 'steps', etc.)
  wandb:
    project: 'dreamerv3_xr_abr'
    group: 'dreamerv3_runs'       
    name: 'dreamer_learner'      
    tags: ['dreamerv3', 'xr_abr', 'zmq_env']