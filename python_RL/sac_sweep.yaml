program: sac_trainer.py
method: random   # or bayes
metric:
  name: episode/return
  goal: maximize
parameters:

  # model_policy_config:
  #   values:
  #     - "SAC_Mlp_Window"
  #     - "SAC_Mlp_Frame"
  #     - "RecurrentSAC_Lstm"
  #     - "RecurrentSAC_Gru"

  algo:
    values: ["SAC", "TD3"]
  learning_rate:
    values: [3e-5, 1e-5, 3e-6, 2e-7]
  tau:
    values: [0.02, 0.01, 0.005, 0.001]
  batch_size:
    values: [4096, 256, 128, 1024, 8192 ]
  gradient_steps:
    values: [1, 2, 8]
  train_freq:
    values: [1, 4]

  buffer_size: 
    values: [2000, 10000, 50000, 100000, 500000]
  ent_coef:
    values: ["auto", 0.35, 0.1,  0.5, 0.7 ]
  net_arch:
    values:
      - [256, 256]
      - [256, 256, 256]
      - [512, 512]
      - [512, 512, 512]

  use_vectorized_obs:
    values: [true, false]

  learning_starts:
    values:
      [1000, 10000, 50000]
  max_grad_norm:
    values: 
      [1.0, 5.0, 10.0, 50.0]

  log_std_init:
    values: [-1.0, -2.0, -3.0]

  target_entropy: 
    values:
      [-1.5, -2, -3]

  gamma:
    values: [0.999, 0.99, 0.9]

  # n_recurrent_layers:
  #   values: [1, 2, 3, 4]
  # recurrent_hidden_size:
  #   values: [64, 128, 256, 512]