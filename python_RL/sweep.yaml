# sweep.yaml
program: sac_trainer.py  # <-- IMPORTANT: Change this to your python script's filename
method: random
metric:
  name: episode/return
  goal: maximize
parameters:
  # algorithm:
  #   values: ['PPO', 'DQN', 'A2C', 'RNN_PPO']
  use_vectorized_obs:
    values: [true, false]
    
  # --- Core Hyperparameters (Shared across models) ---
  learning_rate:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.003
  gamma:
    values: [0.95, 0.99, 0.995]
  net_arch:
    values: [[64, 64], [128, 128], [256, 256]]
  
  # --- PPO Specific Hyperparameters ---
  n_steps:
    values: [256, 512, 1024, 2048]
  batch_size: # Use a unique name to avoid conflicts
    values: [64, 128, 256, 512]
  n_epochs:
    values: [4, 10, 20, 40]
  gae_lambda:
    values: [0.9, 0.95, 0.98]
  clip_range:
    values: [0.1, 0.2, 0.3]


  # ----------------- RNN_PPO-only -----------------
